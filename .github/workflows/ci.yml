name: CI

# The tests of the package on each pull request and each push to main. When the
# tests pass on a release commit (the commit "release: X.Y.Z" that make tag
# pushes with its tag vX.Y.Z), the last jobs make the GitHub release
# (release.yml) and publish the package to npm (publish.yml). So a release
# is tested once, and a red CI publishes nothing.

on:
  pull_request:
  push:
    branches: [main]

# A release commit has a group of its own, so no push cancels it.
concurrency:
  group: "${{ startsWith(github.event.head_commit.message, 'release: ') && format('ci-release-{0}', github.sha) || format('ci-{0}', github.ref) }}"
  cancel-in-progress: "${{ !startsWith(github.event.head_commit.message, 'release: ') }}"

permissions:
  contents: read

jobs:
  js:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The package on Bun too: it imports the build and makes a client.
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Import on Bun
        run: bun -e 'import { OneBillion } from "./dist/index.js"; new OneBillion("key"); console.log("ok")'

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/*.sh

  # The release tag of this commit, when it has one.
  tag:
    needs: [js, bun, shellcheck]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Find the tag of this commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/v" --paginate --jq '.[] | select(.object.sha == "${{ github.sha }}") | .ref' | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write

  publish:
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
